<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PDF Reader</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/web/pdf_viewer.css">
<style>
:root{--bg:#EEF1F5;--bar:#FFFFFF;--tx:#172033;--mu:#64748B;--bd:#E2E8F0;--ac:#B3202F;--ac2:#0E7C86}
[data-theme="dark"]{--bg:#0B1220;--bar:#0D1B2E;--tx:#E6ECF5;--mu:#9AA9BF;--bd:rgba(148,163,184,.2);--ac:#FF7D86;--ac2:#4FD1C5}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;font:14px/1.4 system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
#bar{flex:none;position:relative;height:48px;background:var(--bar);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px;padding:0 8px;z-index:3}
#ttl{font-weight:600;flex:1;min-width:60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,a.b{height:32px;min-width:32px;padding:0 9px;border:1px solid var(--bd);border-radius:8px;background:transparent;color:var(--tx);font:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
button:hover,a.b:hover{border-color:var(--ac);color:var(--ac)}button:disabled{opacity:.4;cursor:default}
#tools{display:flex;align-items:center;gap:6px}#tools.off{display:none}
#pn{width:46px;height:32px;text-align:center;border:1px solid var(--bd);border-radius:8px;background:transparent;color:var(--tx);font:inherit}
#of{color:var(--mu);white-space:nowrap}
#prog{position:absolute;top:0;left:0;height:3px;width:0;background:var(--ac2);z-index:4;transition:width .2s}
#find{flex:none;background:var(--bar);border-bottom:1px solid var(--bd);padding:6px 8px;display:none;gap:6px;align-items:center;z-index:3}
#find.on{display:flex}#q{flex:1;min-width:0;height:32px;border:1px solid var(--bd);border-radius:8px;padding:0 10px;background:transparent;color:var(--tx);font:inherit}#fr{color:var(--mu);font-size:.8rem;white-space:nowrap}
#ctx{flex:none;display:none;padding:7px 12px;background:var(--bar);border-bottom:1px solid var(--bd);border-left:3px solid var(--ac);font-size:.78rem;line-height:1.55;color:var(--mu)}#ctx.on{display:block}#ctx b{color:var(--tx);font-weight:600}#ctx .l1,#ctx .l2{display:flex;flex-wrap:wrap;gap:4px 8px}#ctx .l2{margin-top:1px;color:var(--tx)}#ctx .sep{opacity:.5}#ctx .hl{color:var(--ac);font-weight:700}#ctx a{color:var(--ac2);text-decoration:none;font-weight:600}#ctx a:hover{text-decoration:underline}
#bk{font-weight:600}
#sw{flex:1;min-height:0;position:relative}
#stage{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
#stage .pdfViewer .page{margin:10px auto;border:0;box-shadow:0 2px 14px rgba(10,31,60,.18);background:#fff}
#stage .pdfViewer .page canvas{margin:0;display:block}
#stage.inv .pdfViewer .canvasWrapper canvas{filter:invert(.92) hue-rotate(180deg)}#stage.inv .pdfViewer .page{background:#222}
#stage .textLayer ::selection{background:rgba(59,111,232,.38)}
#stage .textLayer .highlight{background:rgba(255,213,0,.45);border-radius:2px}#stage .textLayer .highlight.selected{background:rgba(255,120,0,.6)}
iframe{border:0;width:100%;height:100%;display:block}.err,.note{padding:30px 20px;text-align:center;color:var(--mu)}.err a{color:var(--ac)}
.note{position:absolute;top:8px;left:8px;right:8px;z-index:5;padding:6px;font-size:.78rem;background:var(--bar);border:1px solid var(--bd);border-radius:8px}
@media(max-width:520px){#bk span,#of,#dk,#zf{display:none}button,a.b{min-width:30px;padding:0 7px}}
</style></head><body>
<div id="bar"><button id="bk" title="Back">←<span>&nbsp;Back</span></button><span id="ttl">Document</span>
 <span id="tools"><button id="pv" title="Previous page">‹</button><input id="pn" inputmode="numeric" value="1" aria-label="Page"><span id="of">/ 1</span><button id="nx" title="Next page">›</button>
 <button id="zo" title="Zoom out">−</button><button id="zf" title="Fit width">⤢</button><button id="zi" title="Zoom in">+</button><button id="sr" title="Search">🔍</button><button id="dk" title="Dark mode">🌓</button></span>
 <a class="b" id="dl" title="Download" target="_blank" rel="noopener">⬇</a><a class="b" id="og" title="Open original" target="_blank" rel="noopener">↗</a></div>
<div id="prog"></div><div id="ctx"></div>
<div id="find"><input id="q" placeholder="Search in this PDF…" autocomplete="off"><button id="fp" title="Previous match">▲</button><button id="fn" title="Next match">▼</button><span id="fr"></span></div>
<div id="sw"><div id="stage"><div id="viewer" class="pdfViewer"></div></div></div>
<script>window.BME_DRIVE_KEY="AIzaSyDRfi8JjRUBAySumP_hLzuL5yJXGE4Bc7E";</script>
<script data-goatcounter="https://bme6iu.goatcounter.com/count" data-goatcounter-settings='{"no_onload":true}' async src="//gc.zgo.at/count.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/web/pdf_viewer.js"></script>
<script>
(function(){
var P=new URLSearchParams(location.search),U=P.get('u')||'',T=P.get('t')||'Document',KEY=window.BME_DRIVE_KEY||'';
function $(i){return document.getElementById(i)}
try{if(localStorage.getItem('bme6_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}
$('ttl').textContent=T;document.title=T+' · PDF Reader';
var m=U.match(/\/d\/([\w-]{10,})/)||U.match(/[?&]id=([\w-]{10,})/),ID=(/drive\.google\.com|docs\.google\.com/.test(U)&&m)?m[1]:'';
var src=ID?(KEY?'https://www.googleapis.com/drive/v3/files/'+ID+'?alt=media&supportsAllDrives=true&key='+encodeURIComponent(KEY):''):U;
$('og').href=ID?'https://drive.google.com/file/d/'+ID+'/view':U;$('dl').href=ID?'https://drive.google.com/uc?export=download&id='+ID:U;if(!ID)$('dl').setAttribute('download','');
var gcDone=false;function gcHit(p,t){if(gcDone)return;gcDone=true;var n=0;(function tr(){if(window.goatcounter&&window.goatcounter.count){try{window.goatcounter.count({path:p,title:t,event:false})}catch(e){}}else if(n++<25)setTimeout(tr,300)})()}
var emb=window.self!==window.top,CTXU='';if(emb)$('ttl').style.visibility='hidden';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
$('bk').onclick=function(){if(emb){try{parent.closeModal();return}catch(e){}}if(CTXU){location.href=CTXU;return}if(history.length>1&&document.referrer)history.back();else location.href='../'};
if(!emb)$('bk').title='Back to site';
try{fetch(new URL('../assets/docs.json',location.href)).then(function(r){return r.json()}).then(function(D){var o=ID&&D[ID];if(!o){gcHit('read/'+(ID||decodeURIComponent((U.split('/').pop()||'file').split('?')[0])),document.title);return}gcHit('read/'+o.c+'/'+(o.k==='book'?'book':(o.ln||o.k)).replace(/\s+/g,'-'),(o.k==='book'?(o.t||'Book'):((o.ln||o.k)+(o.lt?' — '+o.lt:'')))+' · '+o.c);
  var l1='<span>🎓 <b>'+esc(o.sl)+'</b> <i>('+esc(o.sh)+')</i></span><span class="sep">›</span><span>📚 '+(emb||!o.u?'<b>':'<a href="'+esc(o.u)+'"><b>')+esc(o.c)+' · '+esc(o.ct)+(emb||!o.u?'</b>':'</b></a>')+'</span>',l2='';
  if(o.k==='book')l2='<span class="hl">📘 Course Book</span><span class="sep">›</span><span>'+esc(o.t)+'</span>';
  else{l2='<span>📖 <b>Chapter '+esc(o.cn)+'</b>'+(o.cm?' · '+esc(o.cm):'')+'</span><span class="sep">›</span>';
    l2+=o.k==='lecture'?'<span class="hl">🎞 '+esc(o.ln)+'</span>'+(o.lt?'<span>— '+esc(o.lt)+'</span>':''):'<span class="hl">📎 '+esc(o.t)+'</span>'}
  var c=$('ctx');c.innerHTML='<div class="l1">'+l1+'</div><div class="l2">'+l2+'</div>';c.classList.add('on');if(o.u&&!emb){CTXU=o.u;$('bk').title='Back to course';$('bk').lastChild.innerHTML='&nbsp;Back to course'}
  var nm=o.k==='book'?(o.t||''):(o.ln||o.t||'');document.title=(nm?nm+' · ':'')+o.c+' · PDF Reader'}).catch(function(){gcHit('read/'+(ID||'file'),document.title)})}catch(e){}
var sw=$('sw');
function fallback(msg){$('tools').classList.add('off');$('find').classList.remove('on');if(ID){sw.innerHTML='<iframe src="https://drive.google.com/file/d/'+ID+'/preview" allowfullscreen></iframe>';if(msg){var n=document.createElement('div');n.className='note';n.textContent=msg;sw.appendChild(n);setTimeout(function(){n.remove()},4500)}}
 else sw.innerHTML='<div class="err">'+(msg||'Could not open this file')+'<br><br><a href="'+$('og').href+'" target="_blank" rel="noopener">Open original file ↗</a></div>'}
if(!U||!src||!window.pdfjsLib||!window.pdfjsViewer){fallback('');return}
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
var stage=$('stage'),eventBus=new pdfjsViewer.EventBus(),linkService=new pdfjsViewer.PDFLinkService({eventBus:eventBus}),findController=new pdfjsViewer.PDFFindController({eventBus:eventBus,linkService:linkService});
var viewer=new pdfjsViewer.PDFViewer({container:stage,viewer:$('viewer'),eventBus:eventBus,linkService:linkService,findController:findController,textLayerMode:1,removePageBorders:true});
linkService.setViewer(viewer);
var KEYS='bmeRd:'+U,fit=true,ready=false;
var task=pdfjsLib.getDocument({url:src,rangeChunkSize:262144});task.onProgress=function(p){if(p.total)$('prog').style.width=Math.min(100,p.loaded/p.total*100)+'%'};
task.promise.then(function(d){viewer.setDocument(d);linkService.setDocument(d,null)}).catch(function(){fallback('Could not open in the reader — showing the Drive preview')});
eventBus.on('pagesinit',function(){ready=true;$('prog').style.width='0';viewer.currentScaleValue='page-width';$('of').textContent='/ '+viewer.pagesCount;
  try{var s=+localStorage.getItem(KEYS);if(s>1&&s<=viewer.pagesCount)setTimeout(function(){viewer.currentPageNumber=s},60)}catch(e){}});
eventBus.on('pagechanging',function(e){if(document.activeElement!==$('pn'))$('pn').value=e.pageNumber;try{localStorage.setItem(KEYS,e.pageNumber)}catch(er){}});
$('pv').onclick=function(){viewer.previousPage()};$('nx').onclick=function(){viewer.nextPage()};
$('pn').onchange=function(){var n=parseInt(this.value,10)||1;viewer.currentPageNumber=Math.max(1,Math.min(viewer.pagesCount,n))};$('pn').onfocus=function(){this.select()};
$('zi').onclick=function(){fit=false;viewer.currentScale=Math.min(4,viewer.currentScale*1.2)};$('zo').onclick=function(){fit=false;viewer.currentScale=Math.max(.4,viewer.currentScale/1.2)};$('zf').onclick=function(){fit=true;viewer.currentScaleValue='page-width'};
var rt;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(ready&&fit)viewer.currentScaleValue='page-width'},150)});
$('dk').onclick=function(){stage.classList.toggle('inv')};if(document.documentElement.getAttribute('data-theme')==='dark')stage.classList.add('inv');
$('sr').onclick=function(){var f=$('find');f.classList.toggle('on');if(f.classList.contains('on'))$('q').focus()};
function find(type,back){var q=$('q').value;eventBus.dispatch('find',{source:window,type:type,query:q,caseSensitive:false,entireWord:false,highlightAll:true,findPrevious:!!back,matchDiacritics:true});if(!q)$('fr').textContent=''}
var last='';$('q').addEventListener('keydown',function(e){if(e.key==='Enter'){var again=last===this.value;last=this.value;find(again?'again':'',e.shiftKey)}});
$('q').addEventListener('input',function(){if(!this.value){last='';find('')}});
$('fn').onclick=function(){last=$('q').value;find('again',false)};$('fp').onclick=function(){last=$('q').value;find('again',true)};
function st(e){var c=e.matchesCount;if(!$('q').value){$('fr').textContent='';return}$('fr').textContent=(c&&c.total)?(c.current+'/'+c.total+' matches'):((e.state===3)?'Searching…':'No results')}
eventBus.on('updatefindmatchescount',function(e){st({matchesCount:e.matchesCount})});eventBus.on('updatefindcontrolstate',function(e){st(e)});
})();
</script></body></html>
