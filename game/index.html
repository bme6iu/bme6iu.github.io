function germ(){stop();ev('game/germ','Game: Germ Zapper');app.innerHTML=hdr('🦠 Germ Zapper','<span id="gt">⏱ 30s</span>','<span id="gs">⭐ 0 · ❤️❤️❤️</span>')+'<canvas id="cv" style="width:100%;height:min(66vh,420px);background:radial-gradient(circle,rgba(43,179,166,.12),transparent 70%),var(--card);border:1px solid var(--bd);border-radius:16px;touch-action:none;display:block"></canvas><div class="toast" id="gm">Tap the green germs before they touch the cell. Don’t tap the red blood cells!</div>';$('mn').onclick=menu;
 var cv=$('cv'),cx=cv.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,2),W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;cx.scale(dpr,dpr);
 var S={germs:[],rbc:[],score:0,hp:3,t:30,sg:0,sr:0,over:false},core={x:W/2,y:H/2,r:24},last=performance.now(),flash=0;if(DBG){window.__gz=S;window.__core=core}
 function spawn(arr,germ){var e=Math.floor(Math.random()*4),x=e===0?-20:e===1?W+20:Math.random()*W,y=e===2?-20:e===3?H+20:Math.random()*H;if(e===0||e===1)y=Math.random()*H;var dx=core.x-x,dy=core.y-y,d=Math.hypot(dx,dy)||1,sp=germ?(45+Math.random()*35)*(1+(30-S.t)/40):25+Math.random()*20,a=germ?0:(Math.random()-.5)*.7;arr.push({x:x,y:y,vx:dx/d*sp*Math.cos(a)-dy/d*sp*Math.sin(a),vy:dy/d*sp*Math.cos(a)+dx/d*sp*Math.sin(a),r:germ?15:13,ph:Math.random()*6})}
 function draw(){cx.clearRect(0,0,W,H);cx.fillStyle='rgba(229,72,77,.18)';cx.strokeStyle=flash>0?'#E5484D':'#2BB3A6';cx.lineWidth=3;cx.beginPath();cx.arc(core.x,core.y,core.r,0,6.283);cx.fill();cx.stroke();cx.fillStyle=getComputedStyle(document.body).color;cx.font='18px sans-serif';cx.textAlign='center';cx.fillText('🫀',core.x,core.y+6);
  S.rbc.forEach(function(r){cx.fillStyle='#E5484D';cx.beginPath();cx.arc(r.x,r.y,r.r,0,6.283);cx.fill();cx.fillStyle='rgba(120,0,20,.45)';cx.beginPath();cx.arc(r.x,r.y,r.r*.45,0,6.283);cx.fill()});
  S.germs.forEach(function(g){cx.strokeStyle='#4C9A2A';cx.lineWidth=2;for(var k=0;k<8;k++){var a=k*.785+g.ph;cx.beginPath();cx.moveTo(g.x+Math.cos(a)*g.r,g.y+Math.sin(a)*g.r);cx.lineTo(g.x+Math.cos(a)*(g.r+7),g.y+Math.sin(a)*(g.r+7));cx.stroke()}cx.fillStyle='#7CCB4A';cx.beginPath();cx.arc(g.x,g.y,g.r,0,6.283);cx.fill();cx.fillStyle='#2F6B16';cx.beginPath();cx.arc(g.x-4,g.y-3,2.6,0,6.283);cx.arc(g.x+4,g.y-3,2.6,0,6.283);cx.fill()})}
 function upd(){$('gs').textContent='⭐ '+S.score+' · '+heartsOf(S.hp,3);$('gt').textContent='⏱ '+Math.ceil(S.t)+'s'}
 function done(){S.over=true;var r=bestOf('germ',S.score);endView({icon:S.hp>0?'🦠':'💔',title:S.score>=200?'Immune Hero 🏆':S.score>=100?'Great Defender 🛡️':'Keep zapping 💪',big:S.score,sub:S.sg+' germs zapped · '+S.sr+' healthy cells hit'+(r.nb?' · <b style="color:var(--ac2)">New best score!</b>':' · Best: '+r.b),again:germ,share:'I zapped '+S.sg+' germs and scored '+S.score+' in Germ Zapper!'})}
 var sgT=0,srT=0;function loop(now){var dt=Math.min(.05,(now-last)/1000);last=now;S.t-=dt;sgT-=dt;srT-=dt;flash-=dt;if(sgT<=0){spawn(S.germs,true);sgT=Math.max(.35,.9-(30-S.t)*.02)}if(srT<=0){spawn(S.rbc,false);srT=1.3}
  S.germs=S.germs.filter(function(g){g.x+=g.vx*dt;g.y+=g.vy*dt;if(Math.hypot(g.x-core.x,g.y-core.y)<core.r+g.r){S.hp--;flash=.25;return false}return true});S.rbc=S.rbc.filter(function(r){r.x+=r.vx*dt;r.y+=r.vy*dt;return r.x>-40&&r.x<W+40&&r.y>-40&&r.y<H+40});
  draw();upd();if(S.t<=0||S.hp<=0){S.t=Math.max(0,S.t);return done()}raf=requestAnimationFrame(loop)}
 function tap(e){if(S.over)return;var b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top,i;e.preventDefault();for(i=S.germs.length-1;i>=0;i--){var g=S.germs[i];if(Math.hypot(g.x-x,g.y-y)<g.r+14){S.germs.splice(i,1);S.score+=10;S.sg++;$('gm').textContent='💥 Zap! +10';return}}
  for(i=S.rbc.length-1;i>=0;i--){var r=S.rbc[i];if(Math.hypot(r.x-x,r.y-y)<r.r+8){S.rbc.splice(i,1);S.score=Math.max(0,S.score-10);S.sr++;$('gm').textContent='🩸 Oops — that was a healthy red blood cell! −10';return}}}
 cv.addEventListener('pointerdown',tap);raf=requestAnimationFrame(loop)}
