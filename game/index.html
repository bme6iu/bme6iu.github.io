<style>
:root{--bg:#FBF9F5;--card:#fff;--ink:#0A1F3C;--tx:#1B2A3F;--mu:#5B6B80;--bd:#E7E2D9;--ac:#B3202F;--ac2:#0E7C86;--ok:#0F9D6B;--no:#D6334A;--sh:0 8px 30px rgba(10,31,60,.10)}
[data-theme="dark"]{--bg:#07121F;--card:#0D1B2E;--ink:#EAF0F8;--tx:#E6ECF5;--mu:#9AA9BF;--bd:rgba(148,163,184,.2);--ac:#FF7D86;--ac2:#4FD1C5;--ok:#34D399;--no:#FF7D86;--sh:0 8px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box}html{color-scheme:light}html[data-theme="dark"]{color-scheme:dark}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:16px/1.5 'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
header{background:linear-gradient(180deg,#0A1F3C,#0C2748);color:#fff;position:relative;overflow:hidden}
header .in{max-width:880px;margin:0 auto;padding:16px 18px 30px;position:relative;z-index:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.top a{color:#fff;text-decoration:none;font-weight:700;font-size:.95rem;opacity:.95}.top a:hover{text-decoration:underline}
#th{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:1rem}
h1{font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.1;margin:0 0 6px;letter-spacing:-.02em}h1 i{color:#8FE3DA;font-weight:500}

.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.gc{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px}
.gc .ic{font-size:2rem}.gc h2{margin:0;font-family:'Source Serif 4',Georgia,serif;font-size:1.35rem;color:var(--ink)}.gc p{margin:0;color:var(--mu);font-size:.92rem}.gc .best{font-size:.8rem;color:var(--ac2);font-weight:700;margin-top:auto}
button.b{border:0;border-radius:12px;padding:12px 18px;font:700 .95rem inherit;cursor:pointer;background:var(--ac);color:#fff;min-height:44px}button.b:active{transform:scale(.97)}
button.o{background:transparent;color:var(--ink);border:1px solid var(--bd)}button.b:focus-visible,.card:focus-visible,.opt:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
.lv{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.lv button{flex:1;min-width:92px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font-weight:700;color:var(--ink);flex-wrap:wrap}.bar small{color:var(--mu);font-weight:600}
.grid{display:grid;gap:10px;grid-template-columns:repeat(var(--c),1fr)}
.card{perspective:700px;aspect-ratio:3/3.4;border:0;background:none;padding:0;cursor:pointer;font:inherit}
.card .f{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.on .f,.card.dn .f{transform:rotateY(180deg)}
.card .s{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-weight:700;line-height:1.2;border:1px solid var(--bd)}
.card .fr{background:linear-gradient(135deg,#0A1F3C,#12335F);color:#8FE3DA;font-size:1.4rem}
.card .bk{transform:rotateY(180deg);background:var(--card);color:var(--ink);font-size:clamp(.62rem,2.4vw,.86rem)}
.card.t .bk{border-color:var(--ac);color:var(--ac)}.card.dn .bk{background:color-mix(in srgb,var(--ok) 14%,var(--card));border-color:var(--ok)}
.toast{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac2);font-size:.9rem;min-height:3.2em}
.q{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;box-shadow:var(--sh)}
.q h3{margin:0 0 14px;font-size:1.12rem;line-height:1.4;color:var(--ink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{border:2px solid var(--bd);background:transparent;color:var(--ink);border-radius:12px;padding:13px 12px;font:700 .95rem inherit;cursor:pointer;text-align:left;min-height:50px}
.opt:hover:not(:disabled){border-color:var(--ac2)}.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 14%,transparent)}
.tm{height:7px;border-radius:4px;background:var(--bd);overflow:hidden;margin-bottom:14px}.tm i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));transform-origin:left}
.exp{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px dashed var(--bd);font-size:.9rem}.exp b{color:var(--ink)}
.end{text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:28px 20px;box-shadow:var(--sh)}.end .st{font-size:2.2rem;letter-spacing:4px}.end h2{font-family:'Source Serif 4',Georgia,serif;margin:6px 0;color:var(--ink)}.end .sc{font-size:2.4rem;font-weight:800;color:var(--ac)}.end .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.07)}100%{transform:scale(1)}}.pop{animation:pop .3s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><div class="in"><div class="top"><a href="/">← BME6·IU</a><button id="th" aria-label="Toggle theme">☀️</button></div><h1>Biomedical <i>Game Zone</i></h1><p>Tired of studying? Take a five-minute break, and learn something while you play.</p></div>
<svg id="ecg" viewBox="0 0 600 34" preserveAspectRatio="none" aria-hidden="true"><path d="M0 22h90l8-10 8 20 10-30 10 26 7-6h120l8-10 8 20 10-30 10 26 7-6h120l8-10 8 20 10-30 10 26 7-6h50" fill="none" stroke="#2BB3A6" stroke-width="2"/></svg></header>
<main id="app"></main>
<script data-goatcounter="https://bme6iu.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i)},app=$('app');
try{if(localStorage.getItem('bme6_theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');$('th').textContent='🌙'}}catch(e){}
$('th').onclick=function(){var d=document.documentElement,n=d.getAttribute('data-theme')==='dark'?'light':'dark';d.setAttribute('data-theme',n);$('th').textContent=n==='dark'?'🌙':'☀️';try{localStorage.setItem('bme6_theme',n)}catch(e){}};
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function st(k,d){try{var v=localStorage.getItem('bmeGame:'+k);return v===null?d:JSON.parse(v)}catch(e){return d}}function ss(k,v){try{localStorage.setItem('bmeGame:'+k,JSON.stringify(v))}catch(e){}}
function ev(p,t){var n=0;(function tr(){if(window.goatcounter&&window.goatcounter.count){try{window.goatcounter.count({path:p,title:t,event:true})}catch(e){}}else if(n++<8)setTimeout(tr,400)})()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var P=[['ECG','Heart’s electrical activity','Willem Einthoven won the 1924 Nobel Prize for inventing the electrocardiogram.'],['EEG','Brain’s electrical activity','Hans Berger recorded the first human EEG in 1924.'],['EMG','Muscle electrical activity','EMG can help tell a nerve problem from a muscle problem.'],['MRI','Soft-tissue images (magnets)','MRI uses no ionizing radiation — only strong magnets and radio waves.'],['CT scan','X-ray slices of the body','CT builds 3D images from many X-ray slices; Hounsfield and Cormack shared the 1979 Nobel Prize.'],['X-ray','Bone images','Wilhelm Röntgen discovered X-rays in 1895.'],['Ultrasound','Images from sound waves','Diagnostic ultrasound uses sound far above human hearing, in the MHz range.'],['Pacemaker','Keeps heartbeat regular','The first pacemaker implant in a human was in 1958.'],['Defibrillator','Shock to restore rhythm','Modern AEDs speak to you and tell you exactly what to do.'],['Pulse oximeter','Blood oxygen (SpO₂)','It shines red and infrared light through your fingertip.'],['Glucometer','Blood sugar level','A tiny drop of blood on a test strip is enough.'],['Dialysis','Filters blood (kidney failure)','The first successful human hemodialysis was by Willem Kolff in 1943.'],['Ventilator','Helps you breathe','Ventilators push air into the lungs when a patient cannot breathe alone.'],['Stethoscope','Heart & lung sounds','René Laennec invented the stethoscope in 1816.'],['BP monitor','Blood pressure','Normal adult blood pressure is around 120/80 mmHg.'],['Endoscope','Camera inside the body','A flexible tube with a tiny camera and light looks inside organs without big surgery.'],['Neuron','Nerve cell that sends signals','Signals travel along neurons as tiny electrical impulses.'],['Biosensor','Bio-signal → electrical signal','A glucometer is a classic biosensor.'],['Prosthesis','Replaces a body part','Modern prosthetic limbs can be controlled by muscle signals.'],['Biomaterial','Safe material for the body','Titanium is widely used for implants because the body tolerates it well.'],['Electrode','Picks up body signals','ECG, EEG and EMG all start with electrodes on the skin.'],['Transducer','Converts energy forms','An ultrasound probe turns electricity into sound and back.'],['Cochlear implant','Restores hearing electrically','It bypasses damaged hair cells and stimulates the hearing nerve directly.'],['Hemoglobin','Carries oxygen in blood','Hemoglobin gives red blood cells their color and carries oxygen.']];
var C=[['Chest pain and an irregular heartbeat. Which test records the heart’s electrical activity?','ECG','An ECG shows the heart’s rhythm and can reveal arrhythmias.'],['A doctor suspects a broken forearm bone.','X-ray','X-rays show dense structures like bone very clearly.'],['An expecting mother wants to see her baby safely, with no radiation.','Ultrasound','Ultrasound uses sound waves, so it is safe for pregnancy imaging.'],['A patient has repeated seizures. Which test records brain activity?','EEG','EEG records the brain’s electrical signals through scalp electrodes.'],['Quick, painless check of blood oxygen at the fingertip.','Pulse oximeter','It measures oxygen saturation (SpO₂) using red and infrared light.'],['A diabetic patient needs to check blood sugar at home.','Glucometer','A glucometer reads glucose from a tiny blood drop.'],['The heart is quivering in a dangerous rhythm (ventricular fibrillation). What restores it?','Defibrillator','A controlled electric shock can reset the heart’s rhythm.'],['A patient’s kidneys have failed and the blood must be filtered.','Dialysis','Dialysis does the kidneys’ filtering job from outside the body.'],['An ICU patient cannot breathe on their own.','Ventilator','A ventilator moves air in and out of the lungs mechanically.'],['Detailed image of a torn knee ligament (soft tissue).','MRI','MRI gives excellent contrast for soft tissues like ligaments.'],['Suspected bleeding inside the head after an accident — fast cross-section images needed.','CT scan','CT is quick and clearly shows bleeding and fractures in emergencies.'],['A doctor must look inside the stomach with a tiny camera.','Endoscope','An endoscope lets doctors see inside organs through a small opening.'],['Slow heart rate keeps causing fainting. A small implanted device is needed.','Pacemaker','A pacemaker sends small pulses to keep the heart beating regularly.'],['Check electrical activity of muscles in a suspected nerve–muscle disorder.','EMG','EMG records muscle activity using electrodes or fine needles.'],['Measure a patient’s blood pressure.','BP monitor','A sphygmomanometer (BP monitor) measures systolic and diastolic pressure.'],['A child has hearing loss from damaged inner-ear hair cells.','Cochlear implant','It stimulates the hearing nerve directly with electrical signals.'],['An athlete lost a leg and needs a replacement limb.','Prosthesis','A prosthesis replaces a missing body part and restores function.'],['Doctor wants to listen to a patient’s lungs and heart.','Stethoscope','A stethoscope carries body sounds to the doctor’s ears.']];
var NAMES=[];C.forEach(function(c){if(NAMES.indexOf(c[1])<0)NAMES.push(c[1])});
var tmr=null;function stop(){if(tmr){clearInterval(tmr);tmr=null}}
function menu(){stop();var bm=st('match',{}),bd=st('diag',0);
 app.innerHTML='<div class="menu"><div class="gc"><div class="ic">🧠</div><h2>Bio Match</h2><p>Flip the cards and match each biomedical term with its meaning. Learn a fun fact with every match.</p><div class="lv"><button class="b" data-l="0">Easy</button><button class="b" data-l="1">Medium</button><button class="b" data-l="2">Hard</button></div><div class="best">Best: '+['Easy','Medium','Hard'].map(function(n,i){return n+' '+(bm[i]?bm[i]+'s':'—')}).join(' · ')+'</div></div><div class="gc"><div class="ic">🩺</div><h2>Diagnose It!</h2><p>A patient arrives. Pick the right device or test before time runs out. You have 3 lives — can you reach the top?</p><button class="b" id="dx">Start</button><div class="best">Best score: '+(bd||'—')+'</div></div></div>';
 Array.prototype.forEach.call(app.querySelectorAll('[data-l]'),function(b){b.onclick=function(){match(+b.dataset.l)}});$('dx').onclick=diag}
var LV=[{n:6,c:3},{n:8,c:4},{n:10,c:4}];
function match(l){stop();ev('game/match-'+['easy','medium','hard'][l],'Game: Bio Match');var cfg=LV[l],pick=sh(P).slice(0,cfg.n),cards=[];pick.forEach(function(p,i){cards.push({k:i,t:1,x:p[0]});cards.push({k:i,t:0,x:p[1]})});cards=sh(cards);
 var open=[],done=0,moves=0,sec=0,lock=false,started=false;
 app.innerHTML='<div class="bar"><span>🧠 Bio Match <small>'+['Easy','Medium','Hard'][l]+'</small></span><span id="stat">⏱ 0s · 0 moves</span><button class="b o" id="mn">Menu</button></div><div class="grid" style="--c:'+cfg.c+'" id="g">'+cards.map(function(c,i){return'<button class="card'+(c.t?' t':'')+'" data-i="'+i+'" aria-label="Card '+(i+1)+'"><div class="f"><div class="s fr">?</div><div class="s bk">'+esc(c.x)+'</div></div></button>'}).join('')+'</div><div class="toast" id="ts">Tap a card to start.</div>';
 $('mn').onclick=menu;function upd(){$('stat').textContent='⏱ '+sec+'s · '+moves+' moves'}
 Array.prototype.forEach.call(app.querySelectorAll('.card'),function(el){el.onclick=function(){var i=+el.dataset.i;if(lock||el.classList.contains('on')||el.classList.contains('dn'))return;
  if(!started){started=true;tmr=setInterval(function(){sec++;upd()},1000)}el.classList.add('on');open.push(i);
  if(open.length===2){moves++;upd();lock=true;var a=cards[open[0]],b=cards[open[1]],ea=app.querySelectorAll('.card')[open[0]],eb=app.querySelectorAll('.card')[open[1]];
   if(a.k===b.k&&a.t!==b.t){setTimeout(function(){ea.classList.replace('on','dn');eb.classList.replace('on','dn');ea.classList.add('pop');eb.classList.add('pop');done++;$('ts').innerHTML='✅ <b>'+esc(pick[a.k][0])+'</b> — '+esc(pick[a.k][1])+'.<br>💡 '+esc(pick[a.k][2]);open=[];lock=false;if(done===cfg.n)finish()},420)}
   else setTimeout(function(){ea.classList.remove('on');eb.classList.remove('on');open=[];lock=false;$('ts').textContent='Not a match — try again!'},850)}}});
 function finish(){stop();var stars=moves<=cfg.n+Math.ceil(cfg.n*.6)?3:moves<=cfg.n*2+2?2:1,bm=st('match',{});if(!bm[l]||sec<bm[l]){bm[l]=sec;ss('match',bm)}
  setTimeout(function(){app.innerHTML='<div class="end"><div class="st">'+'⭐'.repeat(stars)+'☆'.repeat(3-stars)+'</div><h2>All matched!</h2><p>'+sec+' seconds · '+moves+' moves</p><p style="color:var(--ac2);font-weight:700">Best time: '+bm[l]+'s</p><div class="row"><button class="b" id="ag">Play again</button><button class="b o" id="mm">Menu</button><button class="b o" id="sa">Share</button></div></div>';$('ag').onclick=function(){match(l)};$('mm').onclick=menu;$('sa').onclick=function(){share('I matched all '+cfg.n+' pairs in '+sec+'s on Bio Match!')}},600)}}
function share(t){var u=location.href;if(navigator.share)navigator.share({title:'Biomedical Game Zone',text:t,url:u}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(t+' '+u).then(function(){alert('Copied!')})}
function diag(){stop();ev('game/diagnose','Game: Diagnose It');var qs=sh(C).slice(0,12),i=0,lives=3,score=0,streak=0,T=15;
 function ask(){if(i>=qs.length||lives<=0)return end();var q=qs[i],opts=sh([q[1]].concat(sh(NAMES.filter(function(n){return n!==q[1]})).slice(0,3))),left=T;
  app.innerHTML='<div class="bar"><span>🩺 Diagnose It! <small>Q '+(i+1)+'/'+qs.length+'</small></span><span id="ls">'+'❤️'.repeat(lives)+'🖤'.repeat(3-lives)+'</span><span>⭐ '+score+(streak>=3?' 🔥'+streak:'')+'</span></div><div class="q"><div class="tm"><i id="tb"></i></div><h3>'+esc(q[0])+'</h3><div class="opts">'+opts.map(function(o){return'<button class="opt" data-o="'+esc(o)+'">'+esc(o)+'</button>'}).join('')+'</div><div id="ex"></div></div>';
  var tb=$('tb'),t1=Date.now();stop();tmr=setInterval(function(){left=Math.max(0,T-(Date.now()-t1)/1000);tb.style.transform='scaleX('+left/T+')';if(left<=0){stop();answer(null)}},100);
  Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(b){b.onclick=function(){stop();answer(b.dataset.o)}});
  function answer(a){var ok=a===q[1];Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(b){b.disabled=true;if(b.dataset.o===q[1])b.classList.add('ok');else if(b.dataset.o===a)b.classList.add('no')});
   if(ok){streak++;score+=10+Math.floor(left/3)+(streak>=3?5:0)}else{streak=0;lives--}
   $('ex').innerHTML='<div class="exp">'+(ok?'✅ <b>Correct!</b> ':(a===null?'⏰ <b>Time’s up.</b> ':'❌ <b>Not quite.</b> '))+'The answer is <b>'+esc(q[1])+'</b>. '+esc(q[2])+'</div><div style="margin-top:12px"><button class="b" id="nx">'+(i+1>=qs.length||lives<=0?'See result':'Next →')+'</button></div>';$('ls').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);$('nx').onclick=function(){i++;ask()};$('nx').focus()}}
 function end(){stop();var bd=st('diag',0),nb=score>bd;if(nb)ss('diag',score);var won=i>=qs.length&&lives>0,t=score>=150?'Medical Genius 🏆':score>=90?'Great Resident 🩺':score>=40?'Good Intern 👍':'Keep practicing 📚';
  app.innerHTML='<div class="end"><div class="st">'+(lives>0?'❤️'.repeat(lives):'🖤')+'</div><h2>'+t+'</h2><div class="sc">'+score+'</div><p>'+(won?'You finished the shift!':'Out of lives — the shift is over.')+(nb?' <b style="color:var(--ac2)">New best score!</b>':' Best: '+bd)+'</p><div class="row"><button class="b" id="ag">Play again</button><button class="b o" id="mm">Menu</button><button class="b o" id="sa">Share</button></div></div>';$('ag').onclick=diag;$('mm').onclick=menu;$('sa').onclick=function(){share('I scored '+score+' on Diagnose It! — '+t)}}
 ask()}
menu();
})();
</script></body></html>
